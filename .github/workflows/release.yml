name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install validation tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes poppler-utils shellcheck

      - name: Build and verify both PDFs
        run: ./scripts/check.sh

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            output/pdf/CV_William_Jolivet_fr.pdf \
            output/pdf/CV_William_Jolivet_en.pdf \
            --generate-notes \
            --title "William Jolivet · Resume $GITHUB_REF_NAME"
